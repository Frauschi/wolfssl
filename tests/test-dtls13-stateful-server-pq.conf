# Stateful DTLS 1.3 server against a PQC hybrid group.
#
# This covers the half of the feature the classical conf cannot reach. The
# wolfSSL client omits its key share from the first ClientHello for a PQC group,
# so the server must send a HelloRetryRequest -- and that HRR still carries the
# stateless cookie. The second ClientHello then carries both the large hybrid
# key share and the cookie, so it is fragmented, gets reassembled, and its
# cookie is validated on the complete message.
#
# It therefore asserts the security invariant the design rests on: waiving the
# cookie applies only to the 1-RTT accept, and an HRR is still cookie-protected.

# server: stateful DTLS 1.3 with a post-quantum hybrid group
-u
-v 4
-l TLS13-AES256-GCM-SHA384
--dtls13-stateful-server
--pqc SecP256r1MLKEM768

# client: DTLS 1.3 with the same post-quantum hybrid group
-u
-v 4
-l TLS13-AES256-GCM-SHA384
--pqc SecP256r1MLKEM768
