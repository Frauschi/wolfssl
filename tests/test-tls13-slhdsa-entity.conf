# SLH-DSA entity (leaf) certificate used for the TLS 1.3 handshake signature
# in the CertificateVerify message (draft-reddy-tls-slhdsa). TLS 1.3 only.
#
# Uses a self-signed SLH-DSA-SHAKE-128f certificate. Its ~17KB signature makes
# the CertificateVerify handshake message exceed a single TLS record, so this
# also exercises fragmented CertificateVerify send + reassembly.

# Server-auth scenario.

# server TLSv1.3 TLS13-AES128-GCM-SHA256
-v 4
-l TLS13-AES128-GCM-SHA256
-c ./certs/slhdsa/entity-slhdsa-shake-128f.pem
-k ./certs/slhdsa/entity-slhdsa-shake-128f-priv.pem
-d

# client TLSv1.3 TLS13-AES128-GCM-SHA256
-v 4
-l TLS13-AES128-GCM-SHA256
-A ./certs/slhdsa/entity-slhdsa-shake-128f.pem
-C

# Mutual-auth scenario (SLH-DSA CertificateVerify in both directions).

# server TLSv1.3 TLS13-AES128-GCM-SHA256
-v 4
-l TLS13-AES128-GCM-SHA256
-c ./certs/slhdsa/entity-slhdsa-shake-128f.pem
-k ./certs/slhdsa/entity-slhdsa-shake-128f-priv.pem
-A ./certs/slhdsa/entity-slhdsa-shake-128f.pem
-V
# Remove -V when CRL for SLH-DSA certificates available.

# client TLSv1.3 TLS13-AES128-GCM-SHA256
-v 4
-l TLS13-AES128-GCM-SHA256
-c ./certs/slhdsa/entity-slhdsa-shake-128f.pem
-k ./certs/slhdsa/entity-slhdsa-shake-128f-priv.pem
-A ./certs/slhdsa/entity-slhdsa-shake-128f.pem
-C
