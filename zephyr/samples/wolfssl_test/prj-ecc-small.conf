# Curve sizes SP math has no implementation for, so the module must fall back
# to the generic backend on its own, together with the minimum-key-size
# interaction that decides which curves survive in the table at all.
# Layered on top of prj.conf via CONF_FILE in sample.yaml.

CONFIG_WOLFSSL_ECC=y
CONFIG_WOLFSSL_ECC_192=y
CONFIG_WOLFSSL_ECC_224=y
CONFIG_WOLFSSL_ECC_256=y

# P-192 is the only curve that moves the default minimum, and the minimum is
# what decides which entries survive in wolfCrypt's curve table - so this
# pins both halves of that interaction.
CONFIG_WOLFSSL_ECC_MIN_KEY_SZ=192

# PKCS12 in the full suite needs more heap than the base sample allows.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
