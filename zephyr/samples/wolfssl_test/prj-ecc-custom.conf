# The custom-curve path: Koblitz and Brainpool require WOLFSSL_CUSTOM_CURVES,
# which cannot coexist with the per-curve SP backend, so the module moves the
# whole build onto the generic one. Covers the 320 and 512 sizes, which exist
# only for Brainpool.
# Layered on top of prj.conf via CONF_FILE in sample.yaml.

CONFIG_WOLFSSL_ECC=y
CONFIG_WOLFSSL_ECC_224=y
CONFIG_WOLFSSL_ECC_256=y
CONFIG_WOLFSSL_ECC_320=y
CONFIG_WOLFSSL_ECC_384=y
CONFIG_WOLFSSL_ECC_512=y
CONFIG_WOLFSSL_ECC_KOBLITZ=y
CONFIG_WOLFSSL_ECC_BRAINPOOL=y

CONFIG_MAIN_STACK_SIZE=65536

# The generic backend allocates more per operation than the per-curve one, and
# the largest curves here are 512 bits.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
